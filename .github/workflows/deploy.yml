# Deploy — main push(=병합) 시 CI 통과 후 이미지를 ECR로 빌드→push하고,
# SSM으로 대상 EC2에서 최신 이미지 pull + 정기 인덱싱 cron을 설치한다(배치 도구라 up -d 데몬 아님).
# 인덱싱은 주 1회(일요일 03:00 KST) cron이 `docker compose run --rm chunker python ingest_many.py ...`로 실행하며,
# 동일 명령으로 수동 실행도 가능하다.
#
# 필요 시크릿:  AWS_ROLE_ARN(OIDC), AWS_REGION, AWS_ECR_REGISTRY,
#              DISCORD_WEBHOOK_DEPLOYMENT
# 필요 변수(vars):  CORPUS_EC2_INSTANCE_ID (대상 EC2 인스턴스 ID — AI 레포 corpus EC2와 동일)
# 사전 준비:  ECR 레포 soma/insurance_chunker, EC2에 docker/compose + SSM 에이전트,
#            ECR pull·SSM 가능한 IAM 인스턴스 프로파일, 호스트 ~/insurance-chunker/.env.prod
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 동시 배포 방지(진행 중 배포를 취소하지 않고 큐잉).
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  id-token: write # OIDC
  contents: read

env:
  ECR_REPOSITORY: soma/insurance_chunker
  EC2_DIR: /home/ubuntu/insurance-chunker # 호스트의 compose/.env.prod 위치
  COMPOSE_SERVICE: chunker

jobs:
  # 1) 검사 게이트 — ci.yml 재사용. 실패하면 아래 잡들은 시작되지 않는다.
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # 2) 빌드 → ECR push (:main 가변 / :<sha7> 불변 — 감사·롤백용).
  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: meta
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.AWS_ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:main
            ${{ secrets.AWS_ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3) SSM으로 EC2에서 최신 이미지 pull(데몬 기동 없음).
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 레포의 compose·cron을 base64로 인코딩 → SSM으로 호스트 파일을 덮는다(드리프트 차단).
      - name: Encode files from repo
        id: enc
        run: |
          echo "compose_b64=$(base64 -w0 deploy/docker-compose.prod.yml)" >> "$GITHUB_OUTPUT"
          echo "cron_b64=$(base64 -w0 deploy/insurance-chunker.cron)" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM (pull image + install cron)
        env:
          INSTANCE_ID: ${{ vars.CORPUS_EC2_INSTANCE_ID }}
          REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          if [ -z "$INSTANCE_ID" ]; then
            echo "::error::vars.CORPUS_EC2_INSTANCE_ID 가 비어 있습니다 — GitHub Variables에 설정하세요."
            exit 1
          fi
          CMD=$(cat <<EOF
          set -e
          mkdir -p ${{ env.EC2_DIR }}
          cd ${{ env.EC2_DIR }}
          # compose를 레포 기준으로 갱신(코드가 진실원).
          echo "${{ steps.enc.outputs.compose_b64 }}" | base64 -d > docker-compose.yml
          # .env.prod가 없으면 compose 파싱이 실패하므로 빈 파일로 생성(실행 전 값 채울 것).
          if [ ! -f .env.prod ]; then
            echo "WARN: .env.prod 없음 → 빈 파일 생성. 실행 전 DATABASE_URL·AWS_ECR_REGISTRY 등을 채우세요."
            touch .env.prod
          fi
          # 정기 인덱싱 cron 설치(SSM은 root 실행 → /etc/cron.d 쓰기 가능). cron.d는 root:root 0644 필수.
          echo "${{ steps.enc.outputs.cron_b64 }}" | base64 -d > /etc/cron.d/insurance-chunker
          chown root:root /etc/cron.d/insurance-chunker
          chmod 0644 /etc/cron.d/insurance-chunker
          # 작업 디렉터리·로그는 cron 실행 주체(ubuntu) 소유로. data/에 PDF·docs.yaml을 둔다.
          mkdir -p ${{ env.EC2_DIR }}/data
          touch ${{ env.EC2_DIR }}/cron.log
          chown -R ubuntu:ubuntu ${{ env.EC2_DIR }}
          # compose 이미지 태그(:main)와 레지스트리는 셸 env로 주입.
          export AWS_ECR_REGISTRY="$REGISTRY"
          export IMAGE_TAG=main
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker compose --env-file .env.prod pull ${{ env.COMPOSE_SERVICE }}
          docker image prune -f
          echo "pull + cron 설치 완료(주 1회 일요일 03:00 인덱싱)."
          EOF
          )
          # 스크립트 전체를 base64로 감싸 전달 → 특수문자로 --parameters 파싱이 깨지지 않게.
          B64=$(printf '%s' "$CMD" | base64 -w0)
          printf '{"commands":["echo %s | base64 -d | bash"]}' "$B64" > /tmp/ssm-params.json
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "pull insurance-chunker ${{ github.sha }}" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId=$CMD_ID"
          # 상태를 최대 5분 폴링(이미지 pull이 기본 waiter보다 오래 걸릴 수 있음).
          STATUS=Pending
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            echo "SSM $STATUS ... ($i/60)"
            sleep 5
          done
          echo "SSM Status=$STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "----- SSM StandardError (host) -----"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text 2>/dev/null | tail -50
            exit 1
          fi

  # 4) 결과 알림(성공/실패 무관 항상). 웹훅 미설정 시 조용히 건너뜀.
  notify:
    needs: [build-and-push, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify Discord
        continue-on-error: true
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_DEPLOYMENT }}
          status: ${{ (needs.build-and-push.result == 'success' && needs.deploy.result == 'success') && 'success' || 'failure' }}
          service: insurance-chunker
          environment: prod
          image_tag: ${{ needs.build-and-push.outputs.short_sha }}
