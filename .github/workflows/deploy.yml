# Deploy — main push(=병합) 시 CI 통과 후 이미지를 ECR로 빌드→push하고,
# K8s-manifests 레포의 dev 이미지 태그만 바꿔 커밋한다. 클러스터에 직접 손을 대지 않는다.
#
# 워크로드는 brbs-etl 노드의 k8s Deployment(insurance-chunker)다. 호스트 docker compose로
# 띄우던 시절의 SSM 배포를 여기서 걷어낸다 — 그 경로를 남겨두면 이 워크플로가 도는 순간
# 호스트 컨테이너가 되살아나 k8s 파드와 둘이 같은 RDS에 적재한다(state 디렉터리가 서로 달라
# 중복 판정도 되지 않는다).
#
# 인덱싱 주기는 컨테이너 안 worker.py가 관리한다(INGEST_INTERVAL_SECONDS, 기본 7일).
# 매니페스트·시크릿·노드 전제는 K8s-manifests의 envs/dev/etl.md에 적혀 있다.
#
# 필요 시크릿:  AWS_ROLE_ARN(OIDC), AWS_REGION, AWS_ECR_REGISTRY,
#              MANIFESTS_CI_APP_PRIVATE_KEY, DISCORD_WEBHOOK_DEPLOYMENT
# 필요 변수(vars):  MANIFESTS_CI_CLIENT_ID
# 사전 준비:  ECR 레포 brbs/insurance_chunker(청크 뷰어도 같은 레포에 viewer-<sha7> 태그로 올린다),
#            brbs-manifests-ci GitHub App이 K8s-manifests에 설치돼 있고 contents 쓰기 권한 보유
#            (backend·report·chatbot이 쓰는 것과 같은 앱 — 자격증명만 이 레포에 있으면 된다)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "배포할 태그(sha7). 비우면 이번 커밋으로 빌드한다. 롤백은 여기에 이전 sha7을 넣는다."
        required: false
        default: ""

# 동시 배포 방지(진행 중 배포를 취소하지 않고 큐잉).
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  id-token: write # OIDC
  contents: read

env:
  ECR_REPOSITORY: brbs/insurance_chunker
  # Argo CD가 보는 매니페스트 레포. 이 파일의 image.tag 한 줄이 배포 트리거다.
  MANIFESTS_REPOSITORY: K8s-manifests
  MANIFESTS_VALUES_FILE: envs/dev/etl-chunker.values.yaml
  # 청크 뷰어(Dockerfile.viewer). 파일이 아직 없으면(차트 도입 전) 건너뛴다.
  VIEWER_VALUES_FILE: envs/dev/chunk-viewer.values.yaml

jobs:
  # 1) 검사 게이트 — ci.yml 재사용. 실패하면 아래 잡들은 시작되지 않는다.
  # 태그를 직접 지정한 실행(=롤백)에서는 건너뛴다. main이 깨져서 롤백하는 상황인데
  # CI가 막으면 복구 자체를 못 한다.
  ci:
    if: inputs.image_tag == ''
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # 2) 빌드 → ECR push (:latest 가변 / :<sha7> 불변 — 감사·롤백용).
  build-and-push:
    needs: ci
    # ci가 skipped여도 진행해야 롤백이 된다(needs는 skip을 실패로 보지 않지만,
    # 명시하지 않으면 이 잡까지 통째로 skip된다).
    if: always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      deploy_tag: ${{ steps.meta.outputs.deploy_tag }}
      viewer_built: ${{ steps.viewer.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve deploy tag
        id: meta
        # 태그를 지정했으면 이미 ECR에 있는 이미지를 그대로 쓴다(롤백) — 빌드하지 않는다.
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "deploy_tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::롤백 모드 — 빌드 생략, ${{ inputs.image_tag }} 배포"
          else
            echo "deploy_tag=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push
        if: steps.meta.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.AWS_ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ secrets.AWS_ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.deploy_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 청크 뷰어 — 의존이 달라 이미지를 따로 만든다(Dockerfile.viewer 머리말). 같은 커밋 태그라
      # 뷰어가 늘 청커와 같은 청크·이력 형식을 본다. 캐시는 청커와 섞이지 않게 scope를 나눈다.
      - name: Build & push (viewer)
        id: viewer
        if: steps.meta.outputs.build == 'true'
        # 뷰어 빌드가 깨져도 청커 배포는 막지 않는다 — 그때는 뷰어 태그만 이번 커밋으로 안 올라간다.
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.viewer
          push: true
          tags: |
            ${{ secrets.AWS_ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:viewer-${{ steps.meta.outputs.deploy_tag }}
          cache-from: type=gha,scope=viewer
          cache-to: type=gha,mode=max,scope=viewer

  # 3) K8s-manifests의 dev 이미지 태그를 바꿔 커밋한다. 클러스터 권한은 쓰지 않는다.
  #
  # 떠다니는 태그(:latest)는 매니페스트 문자열이 그대로여서 Argo CD가 아무 일도 하지 않으므로
  # 커밋 해시 태그(sha7)를 쓴다.
  update-manifests:
    name: Update K8s Manifests (dev image tag)
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # 앱 자격증명이 없으면 토큰 발급 단계에서 알아보기 어려운 오류가 나므로 먼저 막는다.
      - name: Check required credentials
        env:
          CLIENT_ID: ${{ vars.MANIFESTS_CI_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.MANIFESTS_CI_APP_PRIVATE_KEY }}
        run: |
          [ -n "$CLIENT_ID" ] || { echo "::error::vars.MANIFESTS_CI_CLIENT_ID 가 비어 있습니다."; exit 1; }
          [ -n "$PRIVATE_KEY" ] || { echo "::error::secrets.MANIFESTS_CI_APP_PRIVATE_KEY 가 비어 있습니다."; exit 1; }

      # brbs-manifests-ci 앱 토큰. K8s-manifests 한 레포의 contents 쓰기로만 범위를 좁힌다.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MANIFESTS_CI_CLIENT_ID }}
          private-key: ${{ secrets.MANIFESTS_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.MANIFESTS_REPOSITORY }}
          permission-contents: write

      - name: Checkout K8s-manifests
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ env.MANIFESTS_REPOSITORY }}
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: manifests

      - name: Commit dev image tag
        working-directory: manifests
        env:
          DEPLOY_TAG: ${{ needs.build-and-push.outputs.deploy_tag }}
          VIEWER_BUILT: ${{ needs.build-and-push.outputs.viewer_built }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # 0809509처럼 숫자로만 된 해시는 따옴표가 없으면 YAML이 숫자로 읽어 이미지 주소가 깨진다.
          yq -i '.image.tag = strenv(DEPLOY_TAG) | .image.tag style="double"' "$MANIFESTS_VALUES_FILE"
          # 청크 뷰어는 이번에 빌드에 성공했을 때만 올린다. 롤백(빌드 생략)이면 그 커밋에 뷰어
          # 이미지가 없을 수 있고, 청커를 되돌린다고 뷰어까지 되돌릴 이유도 없다.
          SUBJECT="insurance-chunker 이미지를 ${DEPLOY_TAG}로 갱신"
          if [ "$VIEWER_BUILT" = "true" ] && [ -f "$VIEWER_VALUES_FILE" ]; then
            export VIEWER_TAG="viewer-${DEPLOY_TAG}"
            yq -i '.image.tag = strenv(VIEWER_TAG) | .image.tag style="double"' "$VIEWER_VALUES_FILE"
            SUBJECT="insurance-chunker·chunk-viewer 이미지를 ${DEPLOY_TAG}로 갱신"
          fi
          if git diff --quiet; then
            echo "이미 $DEPLOY_TAG 태그라 커밋하지 않습니다."
            exit 0
          fi

          BOT_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -am "chore(dev): ${SUBJECT}" \
            -m "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            -m "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # 다른 레포 CI가 먼저 들어가 push가 거절되면 최신 main 위로 다시 올려서 재시도한다.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push 실패(${attempt}/3) — 최신 main 위로 다시 올립니다."
            git pull --rebase origin main
          done
          echo "::error::K8s-manifests main에 push하지 못했습니다."
          exit 1

  # 4) 결과 알림(성공/실패 무관 항상). 웹훅 미설정 시 조용히 건너뜀.
  notify:
    needs: [build-and-push, update-manifests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Notify Discord
        continue-on-error: true
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_DEPLOYMENT }}
          status: ${{ (needs.build-and-push.result == 'success' && needs['update-manifests'].result == 'success') && 'success' || 'failure' }}
          service: insurance-chunker
          environment: dev
          image_tag: ${{ needs.build-and-push.outputs.deploy_tag }}
