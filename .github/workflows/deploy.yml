# Deploy — main push(=병합) 시 CI 통과 후 이미지를 ECR로 빌드→push하고,
# SSM으로 대상 EC2에서 pull → up -d 로 인덱싱 데몬을 기동한다(brbs-corpus-worker와 같은 상시 서비스).
# 인덱싱 주기는 컨테이너 안 worker.py가 관리한다(.env의 INGEST_INTERVAL_SECONDS, 기본 7일).
#
# 필요 시크릿:  AWS_ROLE_ARN(OIDC), AWS_REGION, AWS_ECR_REGISTRY,
#              DISCORD_WEBHOOK_DEPLOYMENT
# 필요 변수(vars):  CORPUS_EC2_INSTANCE_ID (대상 EC2 인스턴스 ID — AI 레포 corpus EC2와 동일)
# 사전 준비:  ECR 레포 soma/insurance_chunker, EC2에 docker/compose + SSM 에이전트,
#            ECR pull·SSM 가능한 IAM 인스턴스 프로파일, 호스트 ~/insurance-chunker/.env
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 동시 배포 방지(진행 중 배포를 취소하지 않고 큐잉).
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  id-token: write # OIDC
  contents: read

env:
  ECR_REPOSITORY: soma/insurance_chunker
  EC2_DIR: /home/ubuntu/insurance-chunker # 호스트의 compose/.env 위치
  COMPOSE_SERVICE: chunker

jobs:
  # 1) 검사 게이트 — ci.yml 재사용. 실패하면 아래 잡들은 시작되지 않는다.
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # 2) 빌드 → ECR push (:latest 가변 / :<sha7> 불변 — 감사·롤백용).
  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: meta
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.AWS_ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ secrets.AWS_ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3) SSM으로 EC2에서 pull → up -d (데몬 기동/갱신).
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 레포의 compose를 base64로 인코딩 → SSM으로 호스트 파일을 덮는다(드리프트 차단).
      - name: Encode files from repo
        id: enc
        run: echo "compose_b64=$(base64 -w0 deploy/docker-compose.prod.yml)" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM (pull + up -d)
        env:
          INSTANCE_ID: ${{ vars.CORPUS_EC2_INSTANCE_ID }}
          REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          if [ -z "$INSTANCE_ID" ]; then
            echo "::error::vars.CORPUS_EC2_INSTANCE_ID 가 비어 있습니다 — GitHub Variables에 설정하세요."
            exit 1
          fi
          CMD=$(cat <<EOF
          set -e
          mkdir -p ${{ env.EC2_DIR }}
          cd ${{ env.EC2_DIR }}
          # compose를 레포 기준으로 갱신(코드가 진실원).
          echo "${{ steps.enc.outputs.compose_b64 }}" | base64 -d > docker-compose.yml
          # .env가 없으면 compose 파싱이 실패하므로 빈 파일로 생성(실행 전 값 채울 것).
          if [ ! -f .env ]; then
            echo "WARN: .env 없음 → 빈 파일 생성. 실행 전 DATABASE_URL·AWS_ECR_REGISTRY 등을 채우세요."
            touch .env
          fi
          # 이전 배포가 설치한 호스트 cron 제거 — 이제 컨테이너 데몬이 주기를 관리한다.
          # 남겨두면 cron과 데몬이 같은 인덱싱을 이중 실행한다.
          rm -f /etc/cron.d/insurance-chunker
          # 작업 디렉터리는 ubuntu 소유로. data/에 PDF·docs.yaml을 둔다.
          # data/state는 실행 이력(runlog) — 컨테이너의 app 유저(uid 1000)가 써야 하므로
          # ubuntu(uid 1000) 소유로 두면 맞아떨어진다. 이미지의 useradd --uid 1000과 짝.
          mkdir -p ${{ env.EC2_DIR }}/data/state
          chown -R ubuntu:ubuntu ${{ env.EC2_DIR }}
          # compose 이미지 태그(:latest)와 레지스트리는 셸 env로 주입.
          export AWS_ECR_REGISTRY="$REGISTRY"
          export IMAGE_TAG=latest
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker compose pull ${{ env.COMPOSE_SERVICE }}
          docker compose up -d --no-deps ${{ env.COMPOSE_SERVICE }}
          docker image prune -f
          docker ps --filter name=brbs-insurance-chunker
          echo "배포 완료 — 데몬 기동(docker logs -f brbs-insurance-chunker)."
          EOF
          )
          # 스크립트 전체를 base64로 감싸 전달 → 특수문자로 --parameters 파싱이 깨지지 않게.
          B64=$(printf '%s' "$CMD" | base64 -w0)
          printf '{"commands":["echo %s | base64 -d | bash"]}' "$B64" > /tmp/ssm-params.json
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "pull insurance-chunker ${{ github.sha }}" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId=$CMD_ID"
          # 상태를 최대 5분 폴링(이미지 pull이 기본 waiter보다 오래 걸릴 수 있음).
          STATUS=Pending
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            echo "SSM $STATUS ... ($i/60)"
            sleep 5
          done
          echo "SSM Status=$STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "----- SSM StandardError (host) -----"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text 2>/dev/null | tail -50
            exit 1
          fi

  # 4) 결과 알림(성공/실패 무관 항상). 웹훅 미설정 시 조용히 건너뜀.
  notify:
    needs: [build-and-push, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify Discord
        continue-on-error: true
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_DEPLOYMENT }}
          status: ${{ (needs.build-and-push.result == 'success' && needs.deploy.result == 'success') && 'success' || 'failure' }}
          service: insurance-chunker
          environment: dev
          image_tag: ${{ needs.build-and-push.outputs.short_sha }}
