# CI — lint(ruff) + import 스모크 + pytest. main PR에서 직접 실행되고,
# deploy.yml(push)에서 workflow_call로 재사용돼 "검사 통과 후에만 배포"를 게이팅한다.
#
# 세 단계 모두 블로킹이다. 이전에는 ruff가 continue-on-error였고 pytest 스텝 자체가 없어
# 게이트가 사실상 import 스모크뿐이었다 — 그 사이 tests/test_search_contract.py는 db/search.py의
# embed_texts→embed_query 변경을 놓친 채 4건 전부 죽어 있었고 아무도 몰랐다.
name: CI

on:
  pull_request:
    branches: [main]
  # deploy.yml이 `uses: ./.github/workflows/ci.yml`로 호출한다. secrets: inherit로 웹훅 전달.
  workflow_call:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev)
        run: pip install -e ".[dev]"

      - name: Ruff lint
        # 배포 대상 코드에 한정(eval/는 실험 스크립트라 제외).
        # 규칙은 pyproject의 [tool.ruff.lint] select로 고정돼 있다 — ruff 버전이 올라도
        # 검사 범위가 저절로 넓어지지 않으므로 블로킹으로 둘 수 있다.
        run: ruff check insurance_chunker db tests ingest.py ingest_many.py ingest_catalog.py rebuild_search_terms.py worker.py runlog.py notify.py healthcheck.py metrics.py logging_setup.py exporter.py slo.py deploy_check.py

      - name: Import smoke
        # 패키지 import + CLI 엔트리포인트가 실제로 로드되는지 확인(의존성 해상도 검증).
        run: |
          python -c "import insurance_chunker; print('insurance_chunker import OK')"
          python ingest.py --help > /dev/null
          python ingest_many.py --help > /dev/null
          python ingest_catalog.py --help > /dev/null
          # 데몬 경로도 확인 — 이미지 CMD가 worker.py라 여기서 깨지면 배포 후 크래시루프가 된다.
          python -c "import worker, runlog, notify, healthcheck, metrics, logging_setup, exporter, slo; print('daemon modules import OK')"
          python metrics.py --help > /dev/null

      - name: Pytest
        # db/search.py 계약(파트너 레포와 맞춘 시그니처)과 운영 계측(runlog/healthcheck,
        # upsert 배치 삽입)을 검증한다. DB·Ollama 없이 도는 테스트만 들어 있다.
        run: pytest -q

      # push(=deploy.yml 경유 호출)일 때만 실패 알림. PR 직접 실행에선 조용히 통과.
      - name: Notify failure (Discord)
        if: failure() && github.event_name == 'push'
        continue-on-error: true
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_CI_FAILURES }}
          status: failure
          service: ci

      # push(=deploy.yml 경유 호출)일 때만 성공 알림. PR 직접 실행에선 조용히 통과(노이즈 방지).
      - name: Notify success (Discord)
        if: success() && github.event_name == 'push'
        continue-on-error: true
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_CI_BUILDS }}
          status: success
          service: ci
