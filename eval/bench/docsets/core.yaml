# 고정 문서셋 — 변형끼리 비교하는 기준이다. 한 번 정하면 함부로 바꾸지 않는다(바꾸면 이전
# 결과와 비교가 끊긴다. 바꿀 땐 새 이름의 문서셋을 만든다).
#
# PDF는 커밋하지 않는다(약관 원문). 카탈로그 sha256(ai.corpus_file_part.sha256)으로 지정하고
# `python eval/bench/bench.py fetch --docset core`로 받는다. 로컬 파일이면 pdf: 경로를 쓴다.
#
# type은 결과를 나눠 보는 축이다 — 문서 구성이 바뀐 것이 개선 효과처럼 보이지 않게.
#   table   표가 많은 약관. VLM·CPU 표 추출 비중이 크다
#   plain   일반 약관
#   random  corpus 무작위 표본(100~400쪽에서 seed 고정 추출). 대표성 보강용
#
# 운영에서 타임아웃·격리·0청크가 난 문서는 여기로 옮겨 회귀 셋으로 쓴다(note에 사유).
# 구성: 6건 — table 2, plain 2, random 2. VLM 상한(문서당 50쪽)이면 문서당 VLM이 최대 약 20~30분
# (동시도 1)이라 6건 전체가 2~3시간 안에 끝난다 — 마일스톤마다 돌릴 수 있는 크기다. 유형별 n=2는
# 문서 단위 결론엔 작지만, 짝지은 비교라 문서 간 편차가 상쇄되고 VLM 지연 분포는 호출 단위로 본다.
# PR마다의 빠른 확인은 smoke(1건)로 한다.
#
# scan 유형은 두지 않는다. corpus에서 무작위 248건을 봤는데 OCR 스캔본(앞 10쪽 대부분이 페이지
# 전체 이미지)이 한 건도 없었다(2026-10-14) — 많아야 1% 안팎이라 6자리 중 2자리를 줄 유형이 아니다.
# 그 두 자리는 무작위 표본(random)으로 채워, 의도적으로 고른 문서만으로 생기는 편향을 줄인다.
# 운영에서 문제가 됐던 279쪽 OCR 스캔본(커밋 0534905)을 찾으면 회귀용으로 따로 더한다.

